<!DOCTYPE html>
<html lang="uk">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/png" href="logo.png">

<title>P1 → DNF</title>

<script src="playerjs.js"></script>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    background: #080808;
    color: #fff;

    font-family: Arial, Helvetica, sans-serif;
}

/* =========================
   ACCESS DENIED
========================= */

#access-denied {

    position: fixed;

    inset: 0;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    background: #080808;

    text-align: center;

    z-index: 9999;
}

.access-logo {

    font-size: 32px;
    font-weight: 800;

    margin-bottom: 25px;
}

.access-title {

    font-size: 24px;
    font-weight: 700;

    letter-spacing: 2px;

    margin-bottom: 10px;
}

.access-text {

    color: #777;

    font-size: 15px;
}

/* =========================
   SITE
========================= */

#site {
    display: none;
}

.container {

    width: 100%;
    max-width: 1200px;

    margin: 0 auto;

    padding: 20px;
}

/* =========================
   HEADER
========================= */

.header {

    display: flex;

    align-items: center;
    justify-content: space-between;

    margin-bottom: 20px;
}

.logo {

    font-size: 26px;
    font-weight: 800;
}

.status {

    display: flex;

    align-items: center;
    gap: 8px;

    font-size: 13px;
    font-weight: 700;

    letter-spacing: 1px;
}

.status-dot {

    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #555;
}

/* LIVE */

.status.live {
    color: #ff3030;
}

.status.live .status-dot {

    background: #ff3030;

    box-shadow: 0 0 8px rgba(255, 48, 48, 0.8);
}

/* OFFLINE */

.status.offline {
    color: #777;
}

.status.offline .status-dot {

    background: #555;

    box-shadow: none;
}

/* =========================
   PLAYER
========================= */

.player {

    position: relative;

    width: 100%;

    aspect-ratio: 16 / 9;

    background: #000;

    overflow: hidden;
}

#player {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 1;
}

/* =========================
   OFFLINE VIDEO
========================= */

#offline-video {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    background: #000;

    z-index: 20;

    display: block;
}

.offline-hidden {

    display: none !important;
}

/* =========================
   TEXT UNDER PLAYER
========================= */

.subtitle {

    margin-top: 12px;

    color: #666;

    font-size: 13px;

    text-align: center;
}

/* =========================
   FOOTER
========================= */

.footer {

    margin-top: 30px;

    padding-top: 15px;

    border-top: 1px solid #181818;

    color: #444;

    text-align: center;

    font-size: 12px;
}

</style>

</head>

<body>


<!-- =========================
     ACCESS
========================= -->

<div id="access-denied">

    <div class="access-logo">
        P1 → DNF
    </div>

    <div class="access-title">
        ACCESS DENIED
    </div>

    <div class="access-text">
        Цей клуб тільки для своїх
    </div>

</div>


<!-- =========================
     SITE
========================= -->

<div id="site">

    <div class="container">

        <div class="header">

            <div class="logo">
                P1 → DNF
            </div>

            <div id="status" class="status offline">

                <div class="status-dot"></div>

                <span id="status-text">
                    OFFLINE
                </span>

            </div>

        </div>


        <!-- =========================
             PLAYER
        ========================= -->

        <div class="player">

            <div id="player"></div>

            <video
                id="offline-video"
                src="offline.mp4"
                autoplay
                muted
                loop
                playsinline>
            </video>

        </div>


        <div class="subtitle">
            Якщо зависло — це не баг, це стратегія.
        </div>


        <div class="footer">
            P1 → DNF
        </div>

    </div>

</div>


<script>

/* =========================
   ACCESS CHECK
========================= */

var params = new URLSearchParams(window.location.search);

var login = params.get("login");
var password = params.get("password");

var ACCESS_GRANTED =
    login === "START" &&
    password === "DNF";


/* =========================
   ACCESS DENIED
========================= */

if (!ACCESS_GRANTED) {

    document.getElementById("access-denied").style.display = "flex";

}


/* =========================
   ACCESS GRANTED
========================= */

else {

    document.getElementById("access-denied").style.display = "none";

    document.getElementById("site").style.display = "block";


    /* =========================
       ELEMENTS
    ========================= */

    var offlineVideo =
        document.getElementById("offline-video");

    var status =
        document.getElementById("status");

    var statusText =
        document.getElementById("status-text");


    /* =========================
       PLAYER
    ========================= */

    var player = new Playerjs({

        id: "player",

        file: "https://x3gk4f.zgrok.io/live/index.m3u8",

        title: "P1 → DNF",

        autoplay: 1,

        live: 1

    });


    /* =========================
       OFFLINE
    ========================= */

    function showOffline() {

        offlineVideo.classList.remove("offline-hidden");

        status.classList.remove("live");
        status.classList.add("offline");

        statusText.textContent = "OFFLINE";

        offlineVideo.play().catch(function() {});

    }


    /* =========================
       LIVE
    ========================= */

    function showLive() {

        offlineVideo.classList.add("offline-hidden");

        status.classList.remove("offline");
        status.classList.add("live");

        statusText.textContent = "LIVE";

    }


    /* =========================
       CHECK STREAM
    ========================= */

    setInterval(function() {

        try {

            var playing =
                player.api("playing");

            var hlsError =
                player.api("hlserror");


            /*
             * Якщо PlayerJS реально відтворює
             * трансляцію — показуємо LIVE.
             */

            if (playing === true) {

                showLive();

            }


            /*
             * Якщо трансляції немає —
             * показуємо інтро.
             */

            else if (hlsError) {

                showOffline();

            }

        }

        catch (e) {

            /*
             * PlayerJS ще може бути
             * не готовий.
             */

        }

    }, 2000);


    /*
     * На старті показуємо інтро.
     */

    showOffline();

}

</script>

</body>

</html>
