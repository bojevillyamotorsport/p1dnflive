<!DOCTYPE html>
<html lang="uk">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/png" href="logo.png">

<title>P1 → DNF</title>

<script src="playerjs.js"></script>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    background: #080808;
    color: #fff;

    font-family: Arial, Helvetica, sans-serif;
}

/* =========================
   ACCESS DENIED
========================= */

#access-denied {

    position: fixed;
    inset: 0;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    background: #080808;

    text-align: center;

    z-index: 9999;
}

.access-logo {

    font-size: 32px;
    font-weight: 800;

    margin-bottom: 25px;
}

.access-title {

    font-size: 24px;
    font-weight: 700;

    letter-spacing: 2px;

    margin-bottom: 10px;
}

.access-text {

    color: #777;

    font-size: 15px;
}

/* =========================
   SITE
========================= */

#site {
    display: none;
}

.container {

    width: 100%;
    max-width: 1200px;

    margin: 0 auto;

    padding: 20px;
}

/* =========================
   HEADER
========================= */

.header {

    display: flex;

    align-items: center;
    justify-content: space-between;

    margin-bottom: 20px;
}

.logo {

    font-size: 26px;
    font-weight: 800;
}

.status {

    display: flex;

    align-items: center;
    gap: 8px;

    font-size: 13px;
    font-weight: 700;

    letter-spacing: 1px;
}

.status-dot {

    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #555;
}

/* LIVE */

.status.live {

    color: #ff3030;
}

.status.live .status-dot {

    background: #ff3030;

    box-shadow: 0 0 8px rgba(255, 48, 48, 0.8);
}

/* OFFLINE */

.status.offline {

    color: #777;
}

.status.offline .status-dot {

    background: #555;

    box-shadow: none;
}

/* =========================
   PLAYER
========================= */

.player {

    position: relative;

    width: 100%;

    aspect-ratio: 16 / 9;

    background: #000;

    overflow: hidden;
}

#player {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;
}

/* =========================
   TEXT
========================= */

.subtitle {

    margin-top: 12px;

    color: #666;

    font-size: 13px;

    text-align: center;
}

/* =========================
   FOOTER
========================= */

.footer {

    margin-top: 30px;

    padding-top: 15px;

    border-top: 1px solid #181818;

    color: #444;

    text-align: center;

    font-size: 12px;
}

</style>

</head>

<body>


<!-- =========================
     ACCESS DENIED
========================= -->

<div id="access-denied">

    <div class="access-logo">
        P1 → DNF
    </div>

    <div class="access-title">
        ACCESS DENIED
    </div>

    <div class="access-text">
        Цей клуб тільки для своїх
    </div>

</div>


<!-- =========================
     SITE
========================= -->

<div id="site">

    <div class="container">

        <div class="header">

            <div class="logo">
                P1 → DNF
            </div>

            <div id="status" class="status offline">

                <div class="status-dot"></div>

                <span id="status-text">
                    OFFLINE
                </span>

            </div>

        </div>


        <!-- PLAYER -->

        <div class="player">

            <div id="player"></div>

        </div>


        <div class="subtitle">
            Якщо зависло — це не баг, це стратегія.
        </div>


        <div class="footer">
            P1 → DNF
        </div>

    </div>

</div>


<script>

/* =========================
   ACCESS
========================= */

var params = new URLSearchParams(window.location.search);

var login = params.get("login");
var password = params.get("password");

var ACCESS_GRANTED =
    login === "START" &&
    password === "DNF";


/* =========================
   ACCESS DENIED
========================= */

if (!ACCESS_GRANTED) {

    document.getElementById("access-denied").style.display = "flex";

}


/* =========================
   ACCESS GRANTED
========================= */

else {

    document.getElementById("access-denied").style.display = "none";
    document.getElementById("site").style.display = "block";


    /* =========================
       SETTINGS
    ========================= */

    var LIVE_URL = "https://1pjezu.zgrok.io/live/index.m3u8";

    var OFFLINE_URL =
        "offline.mp4";


    /* =========================
       ELEMENTS
    ========================= */

    var status =
        document.getElementById("status");

    var statusText =
        document.getElementById("status-text");


    /* =========================
       STATE
    ========================= */

    var currentMode = "offline";

    var switching = false;


    /* =========================
       STATUS
    ========================= */

    function setOffline() {

        status.classList.remove("live");
        status.classList.add("offline");

        statusText.textContent = "OFFLINE";

    }


    function setLive() {

        status.classList.remove("offline");
        status.classList.add("live");

        statusText.textContent = "LIVE";

    }


    /* =========================
       PLAYER
    ========================= */

    var player = new Playerjs({

        id: "player",

        file: [

            {
                title: "Offline",
                file: OFFLINE_URL,
                id: "offline"
            },

            {
                title: "LIVE",
                file: LIVE_URL,
                id: "live"
            }

        ],

        title: "P1 → DNF",

        autoplay: 1,

        loop: 1

    });


    /* =========================
       OFFLINE
    ========================= */

    function playOffline() {

        if (currentMode === "offline") {

            setOffline();

            return;

        }


        if (switching) {
            return;
        }


        switching = true;

        currentMode = "offline";

        setOffline();


        try {

            player.api(
                "play",
                "id:offline"
            );

        }

        catch (e) {

        }


        setTimeout(function() {

            switching = false;

        }, 1000);

    }


    /* =========================
       LIVE
    ========================= */

    function playLive() {

        if (currentMode === "live") {
            return;
        }


        if (switching) {
            return;
        }


        switching = true;


        /*
         * Спочатку перевіряємо,
         * чи взагалі існує HLS manifest.
         */

        fetch(
            LIVE_URL + "?check=" + Date.now(),
            {
                method: "GET",
                cache: "no-store"
            }
        )

        .then(function(response) {

            if (!response.ok) {

                throw new Error(
                    "HLS unavailable"
                );

            }

            return response.text();

        })

        .then(function(text) {

            if (
                !text.includes("#EXTM3U")
            ) {

                throw new Error(
                    "Invalid HLS"
                );

            }


            /*
             * Manifest існує.
             * Перемикаємо PlayerJS на LIVE.
             */

            currentMode = "live";

            setLive();


            player.api(
                "play",
                "id:live"
            );


            /*
             * Даємо HLS час реально
             * почати відтворення.
             */

            setTimeout(function() {

                try {

                    var hlsError =
                        player.api("hlserror");


                    /*
                     * Якщо PlayerJS отримав HLS
                     * помилку — повертаємось OFFLINE.
                     */

                    if (hlsError) {

                        playOffline();

                    }

                }

                catch (e) {

                }


                switching = false;

            }, 4000);

        })

        .catch(function() {

            /*
             * HLS недоступний.
             */

            currentMode = "offline";

            setOffline();

            switching = false;

        });

    }


    /* =========================
       PLAYER EVENTS
    ========================= */

    window.PlayerjsEvents =
        function(event, id, info) {


            /*
             * Помилка відтворення.
             */

            if (
                event === "error" ||
                event === "loaderror"
            ) {

                if (
                    currentMode === "live"
                ) {

                    playOffline();

                }

            }


            /*
             * Якщо PlayerJS почав
             * новий файл.
             */

            if (event === "new") {

                try {

                    var active =
                        player.api("playlist_id");


                    if (active === "live") {

                        currentMode = "live";

                        setLive();

                    }

                    else if (
                        active === "offline"
                    ) {

                        currentMode = "offline";

                        setOffline();

                    }

                }

                catch (e) {}

            }

        };


    /* =========================
       INITIAL
    ========================= */

    setOffline();


    /*
     * Спочатку запускаємо інтро.
     */

    setTimeout(function() {

        try {

            player.api(
                "play",
                "id:offline"
            );

        }

        catch (e) {}

    }, 500);


    /*
     * Потім перевіряємо LIVE.
     */

    setTimeout(function() {

        playLive();

    }, 5000);


    /* =========================
       PERIODIC CHECK
    ========================= */

    setInterval(function() {

        /*
         * Якщо OFFLINE —
         * шукаємо появу стріму.
         */

        if (
            currentMode === "offline"
        ) {

            playLive();

            return;

        }


        /*
         * Якщо LIVE —
         * перевіряємо, чи HLS
         * досі доступний.
         */

        if (
            currentMode === "live"
        ) {

            fetch(
                LIVE_URL + "?check=" + Date.now(),
                {
                    method: "GET",
                    cache: "no-store"
                }
            )

            .then(function(response) {

                if (!response.ok) {

                    throw new Error(
                        "HLS unavailable"
                    );

                }

                return response.text();

            })

            .then(function(text) {

                if (
                    !text.includes("#EXTM3U")
                ) {

                    throw new Error(
                        "Invalid HLS"
                    );

                }

            })

            .catch(function() {

                playOffline();

            });

        }

    }, 7000);

}

</script>

</body>

</html>
